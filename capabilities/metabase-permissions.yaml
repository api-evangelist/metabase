naftiko: 1.0.0-alpha2
info:
  label: Metabase API — Permissions
  description: 'Metabase API — Permissions. 1 operations. Lead operation: List permission groups. Self-contained Naftiko capability
    covering one Metabase business surface.'
  tags:
  - Metabase
  - Permissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    METABASE_API_KEY: METABASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: metabase-permissions
    baseUri: https://your-metabase-instance.com/api
    description: Metabase API — Permissions business capability. Self-contained, no shared references.
    resources:
    - name: permissions-group
      path: /permissions/group
      operations:
      - name: get
        method: GET
        description: List permission groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.METABASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: metabase-permissions-rest
    port: 8080
    description: REST adapter for Metabase API — Permissions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/permissions/group
      name: permissions-group
      description: REST surface for permissions-group.
      operations:
      - method: GET
        name: get
        description: List permission groups
        call: metabase-permissions.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: metabase-permissions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Metabase API — Permissions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-permission-groups
      description: List permission groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: metabase-permissions.get
      outputParameters:
      - type: object
        mapping: $.
