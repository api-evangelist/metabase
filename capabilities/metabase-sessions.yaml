naftiko: 1.0.0-alpha2
info:
  label: Metabase API — Sessions
  description: 'Metabase API — Sessions. 2 operations. Lead operation: Create a session. Self-contained Naftiko capability
    covering one Metabase business surface.'
  tags:
  - Metabase
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    METABASE_API_KEY: METABASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: metabase-sessions
    baseUri: https://your-metabase-instance.com/api
    description: Metabase API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: session
      path: /session
      operations:
      - name: post
        method: POST
        description: Create a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: delete
        method: DELETE
        description: Delete a session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.METABASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: metabase-sessions-rest
    port: 8080
    description: REST adapter for Metabase API — Sessions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/session
      name: session
      description: REST surface for session.
      operations:
      - method: POST
        name: post
        description: Create a session
        call: metabase-sessions.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete
        description: Delete a session
        call: metabase-sessions.delete
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: metabase-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Metabase API — Sessions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-session
      description: Create a session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: metabase-sessions.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-session
      description: Delete a session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: metabase-sessions.delete
      outputParameters:
      - type: object
        mapping: $.
