naftiko: 1.0.0-alpha2
info:
  label: Metabase API — Databases
  description: 'Metabase API — Databases. 3 operations. Lead operation: List databases. Self-contained Naftiko capability
    covering one Metabase business surface.'
  tags:
  - Metabase
  - Databases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    METABASE_API_KEY: METABASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: metabase-databases
    baseUri: https://your-metabase-instance.com/api
    description: Metabase API — Databases business capability. Self-contained, no shared references.
    resources:
    - name: database
      path: /database
      operations:
      - name: get
        method: GET
        description: List databases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post
        method: POST
        description: Add a database connection
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: database-id
      path: /database/{id}
      operations:
      - name: get
        method: GET
        description: Get a database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.METABASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: metabase-databases-rest
    port: 8080
    description: REST adapter for Metabase API — Databases. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/database
      name: database
      description: REST surface for database.
      operations:
      - method: GET
        name: get
        description: List databases
        call: metabase-databases.get
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Add a database connection
        call: metabase-databases.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/database/{id}
      name: database-id
      description: REST surface for database-id.
      operations:
      - method: GET
        name: get
        description: Get a database
        call: metabase-databases.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: metabase-databases-mcp
    port: 9090
    transport: http
    description: MCP adapter for Metabase API — Databases. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-databases
      description: List databases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: metabase-databases.get
      outputParameters:
      - type: object
        mapping: $.
    - name: add-database-connection
      description: Add a database connection
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: metabase-databases.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-database
      description: Get a database
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: metabase-databases.get
      outputParameters:
      - type: object
        mapping: $.
