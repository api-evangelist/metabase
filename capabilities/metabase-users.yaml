naftiko: 1.0.0-alpha2
info:
  label: Metabase API — Users
  description: 'Metabase API — Users. 3 operations. Lead operation: List users. Self-contained Naftiko capability covering
    one Metabase business surface.'
  tags:
  - Metabase
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    METABASE_API_KEY: METABASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: metabase-users
    baseUri: https://your-metabase-instance.com/api
    description: Metabase API — Users business capability. Self-contained, no shared references.
    resources:
    - name: user
      path: /user
      operations:
      - name: get
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post
        method: POST
        description: Create a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: user-id
      path: /user/{id}
      operations:
      - name: get
        method: GET
        description: Get a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.METABASE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: metabase-users-rest
    port: 8080
    description: REST adapter for Metabase API — Users. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/user
      name: user
      description: REST surface for user.
      operations:
      - method: GET
        name: get
        description: List users
        call: metabase-users.get
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Create a user
        call: metabase-users.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/user/{id}
      name: user-id
      description: REST surface for user-id.
      operations:
      - method: GET
        name: get
        description: Get a user
        call: metabase-users.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: metabase-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Metabase API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: metabase-users.get
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user
      description: Create a user
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: metabase-users.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get a user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: metabase-users.get
      outputParameters:
      - type: object
        mapping: $.
